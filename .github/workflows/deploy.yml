name: Deploy DNSHE Assist to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # 项目不存在则创建（首次）
          wrangler pages project list 2>/dev/null | grep -q '^dnshe-assist ' || \
            wrangler pages project create dnshe-assist --production-branch=main || true

      - name: Ensure ASSIST_KV namespace & backfill wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # 幂等创建 ASSIST_KV（按 title 查找，不存在则创建），并回填 wrangler.toml 中的 namespace id。
          # 解决换 CF 账号部署时报 "KV namespace not found" 的问题。
          python3 .github/ensure-kv.py

      - name: Set DNSHE_ACCOUNTS secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DNSHE_ACCOUNTS: ${{ secrets.DNSHE_ACCOUNTS }}
        run: |
          if [ -n "$DNSHE_ACCOUNTS" ]; then
            echo "$DNSHE_ACCOUNTS" | wrangler pages secret put DNSHE_ACCOUNTS --project-name dnshe-assist
          else
            echo "DNSHE_ACCOUNTS secret 为空，跳过（保留线上已有值）"
          fi

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler pages deploy public --project-name dnshe-assist --branch=main