# DNSHE 助力助手 - Cloudflare Worker 配置
# 部署前需设置 secrets：
#   wrangler secret put DNSHE_ACCOUNTS   # JSON 数组：[{name, X-API-Key, X-API-Secret}, ...]
#
# KV namespace（存储助力记录）：GitHub Actions 部署时若 id 为占位符会自动创建并回填
#   手动创建：wrangler kv namespace create ASSIST_KV

name = "dnshe-assist"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"

[[kv_namespaces]]
binding = "ASSIST_KV"
id = "13654212b3b84106a20516f574cacbf9"
