# DNSHE 助力助手 - Cloudflare Pages 配置
# 部署前需设置 secret：
#   DNSHE_ACCOUNTS  # JSON 数组：[{name, X-API-Key, X-API-Secret}, ...]
#
# KV namespace（存储助力记录）：保持 ASSIST_KV binding 名与代码一致
#   wrangler kv namespace create ASSIST_KV

name = "dnshe-assist"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

[[kv_namespaces]]
binding = "ASSIST_KV"
id = "13654212b3b84106a20516f574cacbf9"